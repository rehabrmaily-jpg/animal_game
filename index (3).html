<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خمّن الحيوان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d1;--card:#fffdf6;--ink:#16343b;--soft:#5b7479;--line:#e9dcae;--yes:#2a9d63;--yesbg:#d8f3e3;--no:#d94f2b;--nobg:#fde0d6;--sun:#ffc933;--sky:#2b7fa6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f2a30;--card:#173840;--ink:#f6f1dd;--soft:#9fbcc1;--line:#2b535c;--yes:#58d79a;--yesbg:#1b4a37;--no:#ff8a68;--nobg:#53281d;--sky:#7cc4e6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f2a30;--card:#173840;--ink:#f6f1dd;--soft:#9fbcc1;--line:#2b535c;--yes:#58d79a;--yesbg:#1b4a37;--no:#ff8a68;--nobg:#53281d;--sky:#7cc4e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;font-size:18px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:2rem;margin:4px 0 2px;font-weight:800}
.sub{color:var(--soft);margin:0 0 14px}
.stage{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:18px;text-align:center;box-shadow:6px 6px 0 var(--sun)}
.mystery{font-size:5.5rem;line-height:1.1;transition:transform .3s}
.mystery.pop{transform:scale(1.25) rotate(-6deg)}
.stats{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}
.bubble{min-height:3.2rem;margin-top:8px;padding:8px 14px;border-radius:18px;font-size:1.3rem;font-weight:800;background:var(--line);color:var(--ink)}
.bubble.yes{background:var(--yesbg);color:var(--yes)}
.bubble.no{background:var(--nobg);color:var(--no)}
h2{font-size:1.25rem;margin:22px 0 8px}
.hint{color:var(--soft);font-size:.95rem;margin:6px 2px 0}
button{font:inherit;cursor:pointer}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:10px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus-visible,.go:focus-visible,.quit:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.go{padding:10px 20px;border:2px solid var(--ink);border-radius:14px;background:var(--sky);color:#fff;font-weight:800}
.go.big{background:var(--yes);margin-top:12px;font-size:1.2rem}
.go:disabled,.quit:disabled{opacity:.5;cursor:default}
.quit{margin-top:22px;width:100%;padding:10px;border:2px dashed var(--no);border-radius:14px;background:transparent;color:var(--no);font-weight:800}
#log{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
#log li{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
#log li.y{border-color:var(--yes);background:var(--yesbg);color:var(--yes)}
#log li.n{border-color:var(--no);background:var(--nobg);color:var(--no)}
.end{display:none;margin-top:16px;padding:16px;border-radius:22px;text-align:center;background:var(--card);border:3px solid var(--ink)}
.end.show{display:block}
.end .big{font-size:4rem}
.stars{font-size:2rem;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){.mystery{transition:none}}
</style>
</head>
<body>
<main>
<h1>خمّن الحيوان 🐾</h1>
<p class="sub">اخترتُ حيواناً سرّياً. اكتب أسئلتك بنفسك وجوابها نعم أو لا، ثم خمّن!</p>

<section class="stage">
  <div class="stats"><span id="qc">الأسئلة: 0</span><span id="lives" aria-label="المحاولات المتبقية">❤️❤️❤️❤️❤️</span></div>
  <div class="mystery" id="mys">❓</div>
  <div class="bubble" id="bub" role="status" aria-live="polite">اكتب سؤالك في الأسفل</div>
</section>

<h2>اسأل سؤالاً</h2>
<div class="row">
  <input id="qin" placeholder="اكتب سؤالاً جوابه نعم أو لا" autocomplete="off" aria-label="سؤالك">
  <button class="go" id="qbtn">اسأل</button>
</div>
<p class="hint">اسأل عن شيء واحد في كل مرة: المكان، اللون، الحجم، الطعام، شكل الجسم، الصوت، أو طريقة الحياة.</p>
<ul id="log" aria-label="أسئلتك"></ul>

<h2>هل عرفت؟ اكتب تخمينك</h2>
<div class="row">
  <input id="gin" placeholder="اكتب اسم الحيوان" autocomplete="off" aria-label="تخمينك">
  <button class="go" id="gbtn">خمّن</button>
</div>

<button class="quit" id="quit">🏳️ استسلمت، أرني الحيوان</button>

<section class="end" id="end">
  <div class="big" id="eE"></div>
  <h2 id="eT" style="margin:6px 0"></h2>
  <div class="stars" id="eS"></div>
  <p id="eP" style="margin:4px 0"></p>
  <button class="go big" id="again">العب مرة أخرى</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const nk=s=>s.toLowerCase().replace(/[\u064B-\u0652ـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim();
const norm=s=>nk(s).replace(/^ال/,"");

/* كلمات تدل على كل نوع من الأسئلة */
const RAW={
mammal:"ثديي,يرضع,ترضع",bird:"طائر,طيور",reptile:"زواحف,زاحف",fish:"سمك,اسماك,سمكة",insect:"حشرة,حشرات",amphibian:"برمائي,برمائيات",
water:"الماء,مائي,مياه",sea:"البحر,المحيط,بحري,مالح",river:"النهر,نهر,بحيرة,عذب",aquatic:"فقط في الماء,لا يخرج من الماء,خارج الماء",
land:"اليابسة,على الارض",swim:"يسبح,سباحة,يعوم,سباح",forest:"غابة,غابات,ادغال,جنكل",desert:"صحراء,صحاري,رمال",
mountain:"الجبال,جبل,جبال",tree:"الاشجار,الشجر,شجرة,الاغصان",burrow:"جحر,جحور,تحت الارض,يحفر",farm:"مزرعة,مزارع,الحظيرة",
pet:"البيت,بيوت,المنزل,مع الناس,مع الانسان,البشر",tame:"اليف,يربى,نربي,تربية",zoo:"حديقة الحيوان,السيرك",
local:"بلادنا,الوطن العربي,الشرق الاوسط,عندنا,العالم العربي",africa:"افريقيا,السافانا",asia:"اسيا,الهند,اسيوي",
wild:"بري,البرية,براري,متوحش",hot:"حار,استوائي,دافئ",cold:"بارد,جليد,ثلج,قطب,متجمد",
four:"اربع,قوائم",two:"رجلين,ساقين,قدمين,رجلان,قدمان",six:"ست ارجل,ستة ارجل",nolegs:"بدون ارجل,بلا ارجل,ليس له ارجل,ليس له قوائم",
wings:"جناح,اجنحة",beak:"منقار",feathers:"ريش",scales:"حراشف,قشور,قشر,حرشف",shell:"صدفة,قوقعة,درع",fins:"زعانف,زعنفة",gills:"خياشيم,خيشوم",
horns:"قرون,قرن",fangs:"انياب,ينهش,اسنان حادة,اسنان قوية",claws:"مخالب,مخلب,اظافر",trunk:"خرطوم",mane:"لبدة",hump:"سنام,سنامين,حدبة",
longneck:"رقبة طويلة,رقبته طويلة,عنق طويل,عنقه طويل",longlegs:"ارجل طويلة,ارجله طويلة,ساقين طويلتين,سيقان طويلة",
bigears:"اذن كبيرة,اذان كبيرة,اذنين كبيرتين,اذنيه كبيرة,اذانه كبيرة,اذان طويلة,اذنين طويلتين",
webbed:"اقدام مكفوفة,اقدام شبكية,مكفوف,غشاء بين",fur:"فرو,شعر,وبر,فراء",
stripes:"مخطط,خطوط,مقلم",spots:"بقع,مبقع,نقاط,مرقط",pattern:"نقوش,منقش,زخرف",
tail:"ذيل",longtail:"ذيل طويل,ذيله طويل,ذيل كبير,طويل الذيل,ذيلها طويل",shorttail:"ذيل قصير,ذيله قصير,ذيل صغير,ذيلها قصير",
longbody:"جسمه طويل,جسم طويل,طويل الجسم,نحيف",round:"مستدير,دائري,كروي,مدور,سمين,ممتلئ",
big:"كبير,ضخم,عملاق,اكبر من",small:"صغير,قزم",tiny:"صغير جدا,حجم كف,في كف,في اليد,بحجم اليد",
smallh:"اصغر من الانسان,اقل من الانسان",mid:"متوسط",tall:"هو طويل,طويل القامة,اطول من,طويل جدا,شاهق",heavy:"ثقيل,وزنه",
strong:"قوي",smart:"ذكي,ذكاء",loyal:"وفي,وفاء,مخلص",cunning:"ماكر,مكر",
meat:"لحم,لحوم,يفترس,مفترس,يصطاد,لاحم",herb:"نبات,نباتات,خضار,خضروات,اوراق,عاشب,نباتي",
grass:"عشب,حشيش,يرعى,ترعى,الحشائش",fruit:"فاكهة,فواكه,موز,تفاح",carrot:"جزر",seeds:"حبوب,بذور,مكسرات,جوز,لوز",
flowers:"رحيق,زهور,ازهار",honey:"عسل",omnivore:"ياكل كل شيء,كل شيء,لاحم وعاشب,قارت",
milk:"حليب,لبن",wool:"صوف",eggfood:"ناكل بيضه,ناخذ بيضه,ناكل البيض,ناخذ البيض,بيضها,نحصل منه على البيض",
eggs:"يبيض,يضع بيض,تبيض,يفقس,بيوض,يضعون بيض",fast:"سريع,يركض,يجري,سرعة,عدو,اسرع",slow:"بطيء,بطيئ,ببطء,بطء",
jump:"يقفز,قفز,يثب,يتنطط",climb:"يتسلق,تسلق",fly:"يطير,طيران,يحلق,السماء,يطيرون",
nocturnal:"الليل,ليلا,بالليل,ساهر",group:"قطيع,مجموعات,جماعات,اسراب,عائلة,معا",alone:"منفرد,وحده,وحيد,بمفرده,لوحده",
hibernate:"سبات,يسبت,في الشتاء",migrate:"يهاجر,هجرة,يهاجرون",ride:"يركب,نركب,ركوب",
longlife:"يعيش طويلا,عمره طويل,عمر طويل,يعمر,طويل العمر",endangered:"مهدد,انقراض,منقرض,نادر",
danger:"خطير,خطر,يعض,يؤذي,مخيف,يهاجم",venom:"سام,يلدغ,لدغ,سموم,سم قاتل,له سم,فيه سم,ينتج سم",
roar:"يزأر,زئير,يزمجر",bark:"ينبح,نباح",howl:"يعوي,عواء",meow:"يموء,مواء",moo:"يخور,خوار",neigh:"يصهل,صهيل",
bleat:"يثغو,ثغاء,يمأمأ",cock:"يصيح,صياح,يقوقئ",quack:"بطبطة,يبطبط,كواك",hiss:"يفح,فحيح",chirp:"يزقزق,تغريد,يغرد,زقزقة",
talk:"يتكلم,يقلد,يردد,يتحدث",croak:"ينق,نقيق",buzz:"طنين,يطن",hoot:"يبوم",trumpet:"يبوق,نفير",
white:"ابيض,بيضاء",black:"اسود,سوداء",brown:"بني,قهوائي",grey:"رمادي",yellow:"اصفر,صفراء,ذهبي,اشقر",orange:"برتقالي",
green:"اخضر,خضراء",red:"احمر,حمراء",blue:"ازرق,زرقاء",pink:"وردي,زهري",multicolor:"ملون,الوان"
};
const KW={};for(const k in RAW)KW[k]=RAW[k].split(",").map(nk);
const COLORS=["white","black","brown","grey","yellow","orange","green","red","blue","pink","multicolor"];
/* نوع عام يُحذف إذا ظهر نوع أدق منه في نفس السؤال */
const GEN={water:["sea","river","aquatic"],wild:["forest","desert","africa","asia","cold","mountain"],hot:["desert","africa","forest"],
big:["heavy","tall"],meat:["eatfish","eatinsect"],herb:["grass","fruit","carrot","seeds","flowers"],tail:["longtail","shorttail"],
tame:["pet","farm"],small:["tiny"],cold:["coldblood"]};

/* الحيوانات: رمز، الأسماء، أسماء إضافية للتخمين فقط، الصفات */
const A=[
["🦁","أسد","","mammal four wild big heavy meat fur mane longtail fangs claws danger strong fast africa hot zoo group roar yellow brown"],
["🐘","فيل","","mammal four wild big heavy tall herb grass fruit trunk bigears africa asia hot zoo group strong smart swim ride longlife endangered trumpet grey"],
["🦒","زرافة","","mammal four wild big heavy tall herb longneck longlegs spots africa hot zoo group fast yellow brown"],
["🦓","حمار وحشي|زيبرا","","mammal four wild big herb grass fur mane stripes africa hot zoo group fast black white"],
["🐯","نمر|ببر","","mammal four wild big heavy meat fur stripes longtail fangs claws danger strong fast forest asia hot zoo alone roar swim climb endangered orange black"],
["🐆","فهد","","mammal four wild meat fur spots longtail fangs claws fast longlegs africa hot zoo alone yellow black endangered"],
["🦛","فرس النهر","","mammal four wild big heavy herb grass shorttail river swim africa hot zoo group danger strong round grey"],
["🐒","قرد|قرود","","mammal four wild fur longtail tree climb jump forest africa asia hot zoo group smart fruit herb brown"],
["🐻","دب|دب بني","","mammal four wild big heavy meat herb fruit honey fur forest mountain danger strong fangs claws alone climb swim hibernate shorttail brown zoo"],
["🐻‍❄️","دب قطبي|دب ابيض|دب","","mammal four wild big heavy meat eatfish fur cold danger strong fangs claws alone swim endangered shorttail white zoo"],
["🐺","ذئب","","mammal four wild meat fur longtail fangs claws danger fast forest mountain group howl smart grey brown black local"],
["🦊","ثعلب","","mammal four wild small meat herb fur longtail fangs claws fast forest desert burrow nocturnal alone cunning orange brown white local"],
["🐿️","سنجاب","","mammal four wild small fur longtail tree climb jump forest herb fruit seeds brown grey"],
["🐪","جمل|ناقة","","mammal four big heavy tall herb grass fur hump desert hot tame ride milk longlife local group longlegs strong brown yellow africa asia zoo"],
["🦌","غزال|ظبي","","mammal four wild herb grass fur horns fast desert hot group jump local brown white shorttail"],
["🐴","حصان|فرس","","mammal four big heavy herb grass carrot fur mane longtail farm tame ride fast longlegs neigh strong smart local brown black white"],
["🐄","بقرة|بقر","","mammal four big heavy herb grass fur horns farm tame milk group moo local black white brown"],
["🐑","خروف|نعجة|غنمة","","mammal four herb grass fur wool farm tame milk group bleat local white shorttail"],
["🐐","ماعز|عنزة","","mammal four herb grass fur horns mountain farm tame milk group climb bleat local white black brown shorttail"],
["🐱","قطة|قط|هرة","","mammal four small pet tame meat eatfish fur longtail claws fangs climb jump meow smart local white black brown grey orange"],
["🐶","كلب|كلبة","","mammal four pet tame meat fur longtail claws fangs bark howl loyal smart swim local brown black white"],
["🐰","أرنب","","mammal four small pet tame herb grass carrot fur bigears jump fast burrow shorttail white grey brown local"],
["🐔","دجاجة|دجاج|ديك","","bird two small farm tame herb seeds eatinsect eggs eggfood wings beak feathers cock local white brown red group"],
["🦆","بطة|بط","","bird two small farm tame herb eatinsect eggs eggfood wings beak feathers fly swim water river webbed quack group migrate local white yellow brown"],
["🦅","نسر|عقاب","","bird two meat eatfish eggs wings beak feathers claws fly fast wild mountain alone strong local brown white"],
["🦉","بومة|بوم","","bird two small meat eatinsect eggs wings beak feathers claws fly wild forest tree nocturnal alone hoot smart local brown white grey"],
["🦜","ببغاء|ببغا","","bird two small pet wild tame herb fruit seeds eggs wings beak feathers fly tree forest hot talk chirp smart longlife multicolor green red blue yellow"],
["🦩","فلامنغو|فلامينغو","","bird two herb meat eggs wings beak feathers fly water river wild group migrate longlegs longneck webbed africa hot zoo pink"],
["🐧","بطريق|بنغوين","","bird two eggs meat eatfish wings beak feathers swim water sea cold wild group webbed round zoo black white"],
["🐋","حوت","","mammal water sea aquatic big heavy meat fins swim wild group migrate longlife endangered strong grey blue"],
["🐬","دلفين","","mammal water sea aquatic big meat eatfish fins swim fast jump wild group smart zoo grey"],
["🦈","قرش|سمكة قرش","","fish water sea aquatic big heavy meat eatfish scales fins gills swim fast fangs danger strong wild alone grey"],
["🐠","سمكة زينة|سمكة ملونة","سمكة|سمك","fish water river aquatic small tiny pet eggs scales fins gills swim multicolor orange yellow blue red"],
["🐊","تمساح","","reptile four water river big heavy meat eatfish eggs scales fangs claws danger strong swim wild longtail longbody africa hot zoo longlife green brown"],
["🐍","ثعبان|أفعى|حية","","reptile wild meat eggs scales fangs venom danger nolegs longbody hiss burrow desert hot alone green brown local climb swim"],
["🐢","سلحفاة","","reptile four small pet wild herb eggs shell slow longlife shorttail round green brown local"],
["🐸","ضفدع","ضفدعة","amphibian four small tiny wild eggs water river jump swim webbed croak eatinsect hibernate green brown notail local"],
["🦋","فراشة","","insect six small tiny wild wings fly eggs flowers migrate orange yellow blue black white multicolor notail local"],
["🐝","نحلة|نحل","","insect six small tiny wild wings fly eggs flowers honey makehoney venom group buzz yellow black notail local"]
].map(a=>({e:a[0],names:a[1].split("|"),go:a[2]?a[2].split("|"):[],at:new Set(a[3].split(" "))}));

/* صفات تُستنتج من صفات أخرى */
const D={
pattern:a=>a.at.has("stripes")||a.at.has("spots")||a.at.has("pattern"),
tame:a=>a.at.has("pet")||a.at.has("farm")||a.at.has("tame"),
omnivore:a=>a.at.has("meat")&&a.at.has("herb"),
land:a=>!a.at.has("aquatic"),
warmblood:a=>a.at.has("mammal")||a.at.has("bird"),
coldblood:a=>["reptile","fish","amphibian","insect"].some(k=>a.at.has(k)),
tail:a=>!a.at.has("notail"),
small:a=>a.at.has("small")||a.at.has("tiny"),
smallh:a=>!a.at.has("big"),
mid:a=>!a.at.has("big")&&!a.at.has("small")&&!a.at.has("tiny")
};
const has=(a,k)=>D[k]?D[k](a):a.at.has(k);

let cur,last=-1,qn,lives,over,asked,quitArm;

function newGame(){
  let i;do{i=Math.floor(Math.random()*A.length)}while(i===last&&A.length>1);
  last=i;cur=A[i];qn=0;lives=5;over=false;asked={};quitArm=false;
  $("mys").textContent="❓";$("end").classList.remove("show");
  say("اكتب سؤالك في الأسفل");
  ["qin","gin"].forEach(k=>{$(k).value="";$(k).disabled=false});
  ["qbtn","gbtn","quit"].forEach(k=>$(k).disabled=false);
  $("quit").textContent="🏳️ استسلمت، أرني الحيوان";
  $("log").innerHTML="";stats();
}
function stats(){$("qc").textContent="الأسئلة: "+qn;$("lives").textContent="❤️".repeat(lives)+"🤍".repeat(5-lives)}
function say(t,c){$("bub").textContent=t;$("bub").className="bubble "+(c||"")}
const words=raw=>raw.split(/[\s؟?!.,،]+/).filter(Boolean);
function namesIn(raw){
  const j=" "+words(raw).map(norm).join(" ")+" ";
  return A.filter(a=>a.names.some(n=>j.includes(" "+norm(n)+" ")));
}
function detect(t){
  if(/(^| )دم/.test(t)){if(/بارد/.test(t))return["coldblood"];if(/دافي|دافئ|حار/.test(t))return["warmblood"]}
  const eat=/ياكل|تاكل|يصطاد|غذاء|طعام|يتغذي|يتغذى/;
  if(/سمك|اسماك/.test(t)&&eat.test(t))return["eatfish"];
  if(/حشر/.test(t)&&eat.test(t))return["eatinsect"];
  if(/عسل/.test(t)&&/ينتج|يصنع|يعمل|ننتج|نحصل|تنتج/.test(t))return["makehoney"];
  let h=Object.keys(KW).filter(k=>KW[k].some(w=>t.includes(w)));
  for(const g in GEN)if(h.includes(g)&&GEN[g].some(s=>h.includes(s)))h=h.filter(x=>x!==g);
  return h;
}
function ask(){
  if(over)return;
  const raw=$("qin").value.trim();if(!raw)return;
  const ms=namesIn(raw);
  if(ms.length){
    const skip=new Set(ms.flatMap(a=>a.names.flatMap(n=>norm(n).split(" "))));
    const rest=words(nk(raw)).filter(w=>!skip.has(norm(w))).join(" ");
    if(detect(rest).length===0&&!/ياكل|يعيش|يشبه|مثل|اكبر|اصغر|اسرع|يخاف|يحب|مع/.test(rest))return guessAnimals(ms);
  }
  const hits=detect(nk(raw));
  if(hits.length===0)return say("لم أفهم سؤالك 🤔 اكتبه بطريقة أخرى، مثلاً عن المكان أو اللون أو الحجم أو الطعام","");
  const allColors=hits.length>1&&hits.every(h=>COLORS.includes(h));
  if(hits.length>1&&!allColors)return say("اسأل عن شيء واحد في كل مرة 😉","");
  const key=hits.slice().sort().join("+");
  const yes=hits.every(h=>has(cur,h));
  $("qin").value="";
  if(key in asked)return say("سبق أن سألت هذا: "+(yes?"نعم ✅":"لا ❌"),yes?"yes":"no");
  asked[key]=yes;qn++;
  const li=document.createElement("li");li.className=yes?"y":"n";
  li.textContent=(yes?"✅ ":"❌ ")+raw;$("log").prepend(li);
  say(yes?"نعم! ✅":"لا ❌",yes?"yes":"no");stats();
}
function guess(){
  if(over)return;
  const g=norm($("gin").value);if(!g)return;
  const ms=A.filter(a=>a.names.concat(a.go).some(n=>norm(n)===g));
  if(!ms.length)return say("لم أجد هذا الاسم في اللعبة، تأكد من الكتابة 🤔","");
  $("gin").value="";guessAnimals(ms);
}
function guessAnimals(ms){
  if(over)return;
  if(ms.includes(cur))return finish(true);
  lives--;stats();$("qin").value="";
  if(lives<=0)return finish(false);
  say("ليس "+ms[0].names[0]+"! بقي لك "+lives+" محاولات 🤔","no");
}
function finish(win,quit){
  over=true;
  ["qin","gin","qbtn","gbtn","quit"].forEach(k=>$(k).disabled=true);
  $("mys").textContent=cur.e;$("mys").classList.add("pop");setTimeout(()=>$("mys").classList.remove("pop"),400);
  const st=win?(qn<=8?3:qn<=14?2:1):0;
  $("eE").textContent=cur.e;
  $("eT").textContent=win?"أحسنت! إنه "+cur.names[0]+" 🎉":(quit?"استسلمت! ":"انتهت المحاولات! ")+"كان الحيوان: "+cur.names[0];
  $("eS").textContent=win?"⭐".repeat(st)+"☆".repeat(3-st):"";
  $("eP").textContent=win?"عرفته بعد "+qn+" من الأسئلة":"لا بأس، جرّب مرة أخرى!";
  say(win?"إجابة صحيحة! ✅":"الإجابة: "+cur.names[0],win?"yes":"no");
  $("end").classList.add("show");$("end").scrollIntoView({behavior:"smooth",block:"center"});
}
$("qbtn").onclick=ask;$("gbtn").onclick=guess;
$("qin").addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
$("gin").addEventListener("keydown",e=>{if(e.key==="Enter")guess()});
$("quit").onclick=()=>{
  if(over)return;
  if(!quitArm){quitArm=true;$("quit").textContent="هل أنت متأكد؟ اضغط مرة أخرى";setTimeout(()=>{if(!over){quitArm=false;$("quit").textContent="🏳️ استسلمت، أرني الحيوان"}},3500);return}
  finish(false,true);
};
$("again").onclick=()=>{newGame();window.scrollTo({top:0,behavior:"smooth"})};
newGame();
</script>
